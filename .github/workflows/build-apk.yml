name: Construire l'APK Android

# Se lance à chaque mise à jour de la branche de travail, ou à la main.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances et copier l'appli web dans le projet Android
        run: |
          npm ci
          npm run sync

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: planificat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
